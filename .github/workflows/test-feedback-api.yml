name: Test Pyro Nav feedback API

on:
  push:
    paths:
      - worker/feedback/**
      - .github/workflows/test-feedback-api.yml
  pull_request:
    paths:
      - worker/feedback/**
      - .github/workflows/test-feedback-api.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/feedback/tests/worker.test.mjs
